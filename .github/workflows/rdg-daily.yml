name: RDG Daily Forecast + Toast

# Laptop OFF.
# FourVenues: Integrations API (X-Api-Key) → Firebase forecastLive
# Toast BS: Wed–Sun (Mon/Tue skipped)
#
# TIMING: GitHub schedule crons are often HOURS late — do not treat them as 8:30 AM.
# Primary on-time trigger = workflow_dispatch at ~8:25 AM ET
#   (cron-job.org + Windows task "RDG Daily Cloud Dispatch 825" — see CLOUD-SETUP.md).
# schedule: below is LATE BACKUP / catch-up only.

on:
  schedule:
    # LATE BACKUP only (GitHub often delays these by hours)
    - cron: "30 12 * * *"
    - cron: "0 13 * * *"
    - cron: "0 14 * * *"
    # Afternoon catch-up ~2:00 PM ET for late Toast settlements
    - cron: "0 18 * * *"
  workflow_dispatch:
    inputs:
      job:
        description: "Which job to run"
        required: true
        default: both
        type: choice
        options:
          - both
          - fourvenues
          - toast

jobs:
  fourvenues-forecast:
    if: github.event_name == 'schedule' || github.event.inputs.job == 'both' || github.event.inputs.job == 'fourvenues'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install deps
        run: npm ci || npm install

      - name: FourVenues daily (Integrations API → Firebase)
        id: fv
        env:
          FV_API_KEY_MILA: ${{ secrets.FV_API_KEY_MILA }}
          FV_API_KEY_CASA_NEOS: ${{ secrets.FV_API_KEY_CASA_NEOS }}
          FV_API_KEY_CASA_NEOS_BC: ${{ secrets.FV_API_KEY_CASA_NEOS_BC }}
        run: node fv-refresh-api.cjs

      - name: Mark FourVenues failed if job crashed before status write
        if: failure()
        run: |
          node -e "
          const https=require('https');
          const now=new Date();
          const miami=new Intl.DateTimeFormat('en-CA',{timeZone:'America/New_York',year:'numeric',month:'2-digit',day:'2-digit'}).format(now);
          const payload=JSON.stringify({
            ok:false,
            at: now.toISOString(),
            miamiDay: miami,
            error: 'GitHub Actions fourvenues-forecast job failed',
            what: 'FourVenues Integrations API → Firebase forecastLive'
          });
          const req=https.request({
            hostname:'rdg-dj-dashboard-default-rtdb.firebaseio.com',
            path:'/rdg/scrapeStatus/fourvenues.json', method:'PUT',
            headers:{'Content-Type':'application/json','Content-Length':Buffer.byteLength(payload)}
          }, r=>{ r.resume(); r.on('end',()=>process.exit(0)); });
          req.on('error',()=>process.exit(0));
          req.write(payload); req.end();
          "

  toast-bs:
    if: github.event_name == 'schedule' || github.event.inputs.job == 'both' || github.event.inputs.job == 'toast'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Skip Monday / Tuesday (ET)
        id: dow
        run: |
          DOW=$(TZ=America/New_York date +%u)
          echo "dow=$DOW" >> "$GITHUB_OUTPUT"
          if [ "$DOW" = "1" ] || [ "$DOW" = "2" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "Mon/Tue ET — Toast BS skipped"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.dow.outputs.skip != 'true'

      - uses: actions/setup-node@v4
        if: steps.dow.outputs.skip != 'true'
        with:
          node-version: "20"

      - name: Install deps
        if: steps.dow.outputs.skip != 'true'
        run: npm ci || npm install

      - name: Checkout DJ dashboard
        if: steps.dow.outputs.skip != 'true'
        uses: actions/checkout@v4
        with:
          repository: MLavenant/rdg-dj
          token: ${{ secrets.RDG_DJ_TOKEN }}
          path: rdg-dj

      - name: Toast BS Actual update
        if: steps.dow.outputs.skip != 'true'
        env:
          TOAST_CLIENT_ID: ${{ secrets.TOAST_CLIENT_ID }}
          TOAST_API_SECRET: ${{ secrets.TOAST_API_SECRET }}
          DASHBOARD_PATH: ${{ github.workspace }}/rdg-dj/index.html
        run: node toast-bs-cloud.cjs

      - name: Mark Toast failed if job crashed before status write
        if: failure() && steps.dow.outputs.skip != 'true'
        run: |
          node -e "
          const https=require('https');
          const now=new Date();
          const payload=JSON.stringify({
            ok:false,
            at: now.toISOString(),
            atLocal: now.toLocaleString('en-US',{timeZone:'America/New_York'}),
            schedule: 'Punctual dispatch ~8:25 ET · GitHub schedule = late backup',
            what: 'Toast bottle-service Actual → Firebase toastActuals + index.html',
            message: 'Toast BS cloud FAILED'
          });
          const req=https.request({
            hostname:'rdg-dj-dashboard-default-rtdb.firebaseio.com',
            path:'/rdg/scrapeStatus/toast.json', method:'PUT',
            headers:{'Content-Type':'application/json','Content-Length':Buffer.byteLength(payload)}
          }, r=>{ r.resume(); r.on('end',()=>process.exit(0)); });
          req.on('error',()=>process.exit(0));
          req.write(payload); req.end();
          "

      - name: Push dashboard if changed
        if: steps.dow.outputs.skip != 'true'
        working-directory: rdg-dj
        run: |
          git config user.name "rdg-bot"
          git config user.email "rdg-bot@users.noreply.github.com"
          git add index.html
          git diff --staged --quiet && echo "No dashboard changes" && exit 0
          git commit -m "Auto-refresh: Toast BS Actual (cloud)"
          git push
