name: Bea Hugel breakdown
on:
  workflow_dispatch:
jobs:
  breakdown:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Beatrice tables on Hugel Sunday
        env:
          FV_API_KEY_MILA: ${{ secrets.FV_API_KEY_MILA }}
          FV_API_KEY_CASA_NEOS: ${{ secrets.FV_API_KEY_CASA_NEOS }}
          FV_API_KEY_CASA_NEOS_BC: ${{ secrets.FV_API_KEY_CASA_NEOS_BC }}
        run: node scripts/bea-hugel.cjs
