name: BOH Weekly Refresh

# Same cloud-first model as DJ:
# GitHub-hosted runner → Toast/OT → Firebase + Pages. Laptop can be off.

on:
  schedule:
    # ~8:30 AM ET during daylight time; second run is the backup.
    - cron: "30 12 * * 1"
    - cron: "0 13 * * 1"
  workflow_dispatch:

jobs:
  boh-weekly:
    runs-on: windows-latest
    timeout-minutes: 120
    permissions:
      contents: write
      actions: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Restore encrypted Toast Web Admin session
        shell: powershell
        env:
          TOAST_SESSION_GZIP_B64: ${{ secrets.TOAST_SESSION_GZIP_B64 }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:TOAST_SESSION_GZIP_B64)) {
            throw "Missing GitHub secret TOAST_SESSION_GZIP_B64"
          }
          $compressed = [Convert]::FromBase64String($env:TOAST_SESSION_GZIP_B64)
          $input = [IO.MemoryStream]::new($compressed)
          $gzip = [IO.Compression.GzipStream]::new($input, [IO.Compression.CompressionMode]::Decompress)
          $output = [IO.File]::Create((Join-Path $env:GITHUB_WORKSPACE "toast-session.json"))
          $gzip.CopyTo($output)
          $output.Dispose(); $gzip.Dispose(); $input.Dispose()
          $session = Get-Content toast-session.json -Raw | ConvertFrom-Json
          if (-not $session.cookies -or $session.cookies.Count -eq 0) {
            throw "Decoded Toast session contains no cookies"
          }
          Write-Host "Toast session restored ($($session.cookies.Count) cookies)"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install deps
        shell: cmd
        run: npm ci || npm install

      # Toast/OT use system Edge on windows-latest (channel: msedge).
      # No Playwright Chromium download required.

      - name: Fetch + process week (Toast + OpenTable)
        id: fetch
        shell: cmd
        env:
          BOH_ROOT: ${{ github.workspace }}
          OT_USERNAME: ${{ secrets.OT_USERNAME }}
          OT_PASSWORD: ${{ secrets.OT_PASSWORD }}
          OT_CLIENT_ID: ${{ secrets.OT_CLIENT_ID }}
        run: node weekly-save-cloud.cjs

      - name: Upload Toast session debug screenshot
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: toast-session-debug
          path: toast-session-refresh-fail.png
          if-no-files-found: ignore

      - name: Pipeline health gate
        id: health
        shell: cmd
        env:
          BOH_ROOT: ${{ github.workspace }}
        run: node pipeline-health.cjs

      # Same staffing join as local weekly-auto-run.bat (FTE optional — exits 0 if missing)
      - name: Food staffing join (FTE × labor)
        shell: cmd
        env:
          BOH_ROOT: ${{ github.workspace }}
        run: node weekly-staffing.cjs
        continue-on-error: true

      - name: Publish processed weeks to Firebase
        id: firebase
        shell: cmd
        env:
          BOH_ROOT: ${{ github.workspace }}
        run: node boh-publish-firebase.cjs

      - name: Rebuild dashboard shell
        shell: cmd
        env:
          BOH_ROOT: ${{ github.workspace }}
        run: node build-unified-v2.cjs

      - name: Commit + push GitHub Pages
        shell: powershell
        run: |
          git config user.name "rdg-bot"
          git config user.email "rdg-bot@users.noreply.github.com"
          git add dashboard.html pipeline-health.json item-station-map.json
          Get-ChildItem -Name "*-data-*.json","*-data.json" -ErrorAction SilentlyContinue | ForEach-Object { git add -- $_ }
          $staged = @(git diff --staged --name-only)
          if ($staged.Count -eq 0) { Write-Host "No dashboard changes"; exit 0 }
          git commit -m "BOH weekly auto-update (cloud)"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git pull --rebase origin main
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git push origin HEAD:main
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Mark scrapeStatus failed
        if: failure()
        shell: cmd
        run: node fb-scrape-status.cjs bohWeekly fail "BOH weekly GitHub-hosted Actions job failed" "{\"schedule\":\"Mon ~8:30 AM ET (+ ~9:00 backup)\",\"what\":\"BOH weekly Toast+OT → Firebase + Pages\"}"
